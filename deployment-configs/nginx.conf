# Nginx SPA rewrite configuration.
# Merge the relevant `location` block into your server config.
server {
  listen 80;
  server_name www.technicaljournals.org;
  root /var/www/technical-journals/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }
}
